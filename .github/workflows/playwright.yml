name: Playwright
on:
  deployment_status:
jobs:
  test-e2e:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.target_url, 'oak-ai-lesson-assistant')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install

      - uses: ./.github/actions/ref_from_sha
        name: Get PR Ref from SHA
        id: ref_from_sha
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Inject Doppler env vars
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true
      - name: Run Playwright tests
        working-directory: apps/nextjs
        # Only include @openai tests on RC branches
        run: |
          if [[ "${{ steps.ref_from_sha.outputs.branch_name }}" =~ ^rc$ ]]; then
            pnpm test-e2e
          else
            pnpm test-e2e --grep-invert @openai
          fi
        env:
          TEST_BASE_URL: ${{ github.event.deployment_status.target_url }}
          TEST_USER_EMAIL: ${{ steps.doppler.outputs.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ steps.doppler.outputs.TEST_USER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ steps.doppler.outputs.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ steps.doppler.outputs.CLERK_SECRET_KEY }}
      - name: Deploy Playwright report
        id: deploy-report
        if: ${{ !cancelled() }}
        # Hosting the report is a convenience; a failure here shouldn't fail the test run
        continue-on-error: true
        run: |
          npx vercel link \
            --cwd=apps/nextjs/playwright-report \
            --scope=${{ secrets.TEST_REPORT_VERCEL_SCOPE }} \
            --project=${{ secrets.TEST_REPORT_VERCEL_PROJECT }} \
            --yes \
            --token=${{ secrets.TEST_REPORT_VERCEL_TOKEN }}

          DEPLOYMENT_URL=$(npx vercel deploy --cwd=apps/nextjs/playwright-report --yes --token=${{ secrets.TEST_REPORT_VERCEL_TOKEN }})
          echo "deployment-url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"

      - name: Warn if Playwright report deploy failed
        id: report-warning
        if: ${{ !cancelled() && steps.deploy-report.outcome == 'failure' }}
        run: |
          echo "::warning title=Playwright report not deployed::Uploading the HTML report to Vercel failed, so this run has no report link. Check the 'Deploy Playwright report' step logs and the TEST_REPORT_VERCEL_* secrets."

          WARNING="> [!WARNING]
          > The Playwright HTML report could not be deployed to Vercel, so there is no report link for this run. Check the 'Deploy Playwright report' step logs."
          echo "$WARNING" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "comment<<EOF"
            echo "$WARNING"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate PR comment
        id: generate-pr-comment
        uses: daun/playwright-report-summary@5359ae22f265fd2dfdb7744a0cc6614c5c3abde6 # v4.1.1
        if: ${{ !cancelled() }}
        with:
          report-file: apps/nextjs/results.json
          report-url: ${{ steps.deploy-report.outputs.deployment-url }}
          job-summary: true
          create-comment: false
      - name: Set PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: ${{ !cancelled() && steps.ref_from_sha.outputs.pr_number }}
        with:
          number: ${{ steps.ref_from_sha.outputs.pr_number }}
          message: |
            ${{ steps.generate-pr-comment.outputs.summary }}

            ${{ steps.report-warning.outputs.comment }}
          header: playwright-report
