name: Agentic scoring freshness

on:
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check agentic scoring freshness
        run: ./packages/aila/src/lib/agentic-system/scoring/check-scoring-freshness.sh
