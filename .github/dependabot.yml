version: 2
updates:
  # Track npm updates across the pnpm workspace. Scanning the root is enough:
  # Dependabot reads pnpm-workspace.yaml and bumps every package that
  # declares a dependency, in one PR against the single lockfile. Scanning
  # apps/* and packages/* as well raised the same bump once per directory.
  #
  # Security-update PRs are deliberately left ungrouped: Dependabot's groups
  # have no severity filter, so grouping security updates would bundle
  # criticals in with everything else. Leaving them alone keeps every
  # vulnerability - critical or not - on its own PR.
  #
  # A dependency joins the first group whose patterns match, whatever that
  # group's update-types, and updates the group excludes arrive as separate
  # PRs. So majors outside storybook and jest arrive one PR per package
  # (@trpc/* and prisma/@prisma/* included): push the other bumps onto one
  # PR and close the rest.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Storybook core, addons and its eslint/msw integrations track one major.
      storybook:
        patterns:
          - storybook
          - "@storybook/*"
          - "@chromatic-com/storybook"
          - eslint-plugin-storybook
          - msw-storybook-addon
        update-types: [major, minor, patch]
      # jest + ts-jest + @types/jest break on mismatched majors, and jest
      # itself is a direct dep in six separate packages.
      jest:
        patterns:
          - jest
          - "jest-*"
          - "@types/jest"
          - ts-jest
          - "@testing-library/*"
          - setup-polly-jest
        update-types: [major, minor, patch]
      # Everything else: routine minor and patch updates in one PR. Majors
      # are left ungrouped so they surface individually for review.
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # Track updates for Github Actions workflows from oak-terraform-actions repository.
  - package-ecosystem: "github-actions"
    directory: "/"
    allow:
      - dependency-name: "oaknational/oak-terraform-actions"
      - dependency-name: "oaknational/oak-release-actions"
    schedule:
      interval: "daily"

  # Track updates for Terraform modules from oak-terraform-modules repository.
  - package-ecosystem: "terraform"
    directories: ["infrastructure/**/*"]
    allow:
      - dependency-name: "*::github::oaknational/oak-terraform-modules::*"
    schedule:
      interval: "daily"
